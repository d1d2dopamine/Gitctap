[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gitctap"
version = "0.2.0"
description = "One local Git project, several Git forges, one command."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "d1d2dopamine" }]
keywords = ["git", "push", "multi-remote", "github", "codeberg", "gitlab", "gitea", "forge", "cli"]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/d1d2dopamine/gitctap"
Source = "https://github.com/d1d2dopamine/gitctap"
Changelog = "https://github.com/d1d2dopamine/gitctap/blob/main/CHANGELOG.md"
Issues = "https://github.com/d1d2dopamine/gitctap/issues"

[project.scripts]
gitctap = "gitctap:main"

[tool.setuptools]
py-modules = ["gitctap"]
